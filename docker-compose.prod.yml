version: '3.8'

services:
  # Nginx Reverse Proxy & Micro-cache Load Balancer
  nginx:
    image: nginx:alpine
    container_name: busroute-load-balancer
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - busroute-net

  # Horizontally Scaled Backend Service Cluster
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - WEB_CONCURRENCY=4
      - LOG_LEVEL=info
    deploy:
      mode: replicated
      replicas: 4
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - busroute-net

  # Redis Distributed Cache (Optional Tier for Horizontal Shared State)
  redis:
    image: redis:7-alpine
    container_name: busroute-redis
    restart: always
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly no
    networks:
      - busroute-net

networks:
  busroute-net:
    driver: bridge
