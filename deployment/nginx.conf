# BusRoute — High-Concurrency Reverse Proxy & Load Balancer
# Handles 50,000+ RPS from 1 Million Concurrent Users

user nginx;
worker_processes auto;
worker_rlimit_nofile 1048576; # Max open file descriptors for 1M concurrent sockets

events {
    worker_connections 65535;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # High-Performance I/O
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    types_hash_max_size 2048;

    # Gzip Compression Tier
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        image/svg+xml;

    # Rate Limiting (DDoS and Traffic Surge Protection)
    limit_req_zone $binary_remote_addr zone=api_burst_limit:20m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=addr_conn_limit:20m;

    # Micro-Cache for Thundering Herds (absorbs 90% duplicate journey searches)
    proxy_cache_path /var/cache/nginx/busroute levels=1:2 keys_zone=BUSROUTE_CACHE:50m max_size=1g inactive=10m use_temp_path=off;

    # Upstream Backend Cluster (Horizontal Pod Replicas)
    upstream busroute_backend {
        least_conn; # Distribute to least loaded worker
        server backend-node-1:8000 max_fails=3 fail_timeout=10s;
        server backend-node-2:8000 max_fails=3 fail_timeout=10s;
        server backend-node-3:8000 max_fails=3 fail_timeout=10s;
        server backend-node-4:8000 max_fails=3 fail_timeout=10s;
        keepalive 128; # Keepalive connections to backends
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 10M;
        limit_conn addr_conn_limit 500;

        # Static Frontend SPA & Assets (Edge Caching)
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            expires 1d;
            add_header Cache-Control "public, no-transform";
        }

        # Static Map and Font Assets
        location /assets/ {
            root /usr/share/nginx/html;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        # API Endpoints
        location /api/ {
            limit_req zone=api_burst_limit burst=50 nodelay;

            proxy_pass http://busroute_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Micro-caching for popular transit search spikes
            proxy_cache BUSROUTE_CACHE;
            proxy_cache_methods GET POST;
            proxy_cache_key "$request_method$request_uri|$request_body";
            proxy_cache_valid 200 5s; # 5-second microcache absorbs commuter stampedes
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Health Probe (Bypasses Cache & Rate Limits)
        location /health {
            proxy_pass http://busroute_backend;
            access_log off;
        }
    }
}
