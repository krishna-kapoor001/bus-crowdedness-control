apiVersion: apps/v1
kind: Deployment
metadata:
  name: busroute-backend
  labels:
    app: busroute-backend
spec:
  replicas: 4
  selector:
    matchLabels:
      app: busroute-backend
  template:
    metadata:
      labels:
        app: busroute-backend
    spec:
      containers:
      - name: busroute
        image: busroute:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: WEB_CONCURRENCY
          value: "4"
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2048Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: busroute-service
spec:
  type: ClusterIP
  selector:
    app: busroute-backend
  ports:
  - port: 8000
    targetPort: 8000
---
# Horizontal Pod Autoscaler for 1 Million Concurrent Users Surge
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: busroute-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: busroute-backend
  minReplicas: 4
  maxReplicas: 64
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
